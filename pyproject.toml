[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "content-blocking-proxy"
version = "0.1.0"
description = "A centrally configured HTTP/HTTPS content filtering proxy for a home server"
requires-python = ">=3.12"
dependencies = ["mitmproxy==12.3.0", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
content-proxy = "content_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

