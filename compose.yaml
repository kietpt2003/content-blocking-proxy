services:
  proxy:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8080}:8080"
    volumes:
      - ./config:/app/config:ro
      - proxy-state:/state
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -m, content_proxy.healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  proxy-state:

